# Builds the Windows installer and publishes it as a GitHub release.
# Installed copies of Project 360 check these releases and update themselves.
#
#   1. Bump "version" in package.json, commit.
#   2. git tag v0.2.0 && git push --tags
#
# Code signing (optional but recommended — removes the SmartScreen warning):
#   add repository secrets WINDOWS_CERT_BASE64 (your .pfx, base64-encoded) and
#   WINDOWS_CERT_PASSWORD. Without them the installer is built unsigned.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The native helper compiles with the C# compiler that ships with Windows.
      - run: npm run build:native

      # Without signing secrets, drop the empty values so the build is simply unsigned.
      - name: Build and publish installer
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK) { Remove-Item Env:CSC_LINK, Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue }
          npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
